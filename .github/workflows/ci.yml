name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Health check against the real Supabase project. Non-blocking: a transient
      # outage or missing secret on a fork PR shouldn't fail the whole pipeline.
      - name: Supabase smoke test
        run: pnpm smoke:supabase
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # E2E specs (Playwright) — added non-blocking while we build confidence in
      # headless-runner stability; see TRADEOFFS.md for the plan to make it a gate.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        continue-on-error: true

      - name: E2E tests
        run: pnpm test:e2e
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
